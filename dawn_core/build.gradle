plugins {
	id "java"
	id "application"
	id "idea"
	id("io.freefair.lombok") version "9.1.0"
}

def lwjglNatives = "natives-linux"

dependencies {
	implementation(project(":lib"))
	runtimeOnly(project(":app"))
	implementation(libs.log4j)
	compileOnly(libs.jspecify)
	implementation(platform(libs.lwjgl))
	implementation("org.lwjgl:lwjgl")
	implementation("org.lwjgl:lwjgl-glfw")
	implementation("org.lwjgl:lwjgl-openal")
	implementation("org.lwjgl:lwjgl-opengl")
	implementation("org.lwjgl:lwjgl-stb")
	implementation("org.lwjgl:lwjgl::$lwjglNatives")
	implementation("org.lwjgl:lwjgl-glfw::$lwjglNatives")
	implementation("org.lwjgl:lwjgl-openal::$lwjglNatives")
	implementation("org.lwjgl:lwjgl-opengl::$lwjglNatives")
	implementation("org.lwjgl:lwjgl-stb::$lwjglNatives")
}

application {
	mainClass = "dawn.core.Main"

	applicationDefaultJvmArgs = [
		"-XX:+AllowEnhancedClassRedefinition",
		"--enable-native-access=ALL-UNNAMED",
		"-Ddawn.workspace.root=$rootDir/run",
		"-Ddawn.log.level=TRACE",
	]
}

tasks.named("run") {
	classpath = sourceSets.main.runtimeClasspath.filter { it != jar.archiveFile.get().asFile }
}

apply from: "$rootDir/gradle/env.gradle"

jar {
	manifest {
		attributes(
			"Implementation-Title": rootProject.name,
			"Implementation-Version": project.version,
			"Main-Class": "dawn.core.Main",
			"Class-Path": configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
		)
	}
}